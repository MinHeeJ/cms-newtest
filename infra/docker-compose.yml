services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
    ports:
      - "5433:5432"
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: cms-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    pull_policy: build
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cms}
      DB_USER: ${POSTGRES_USER:-cms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cms}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5188}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://backend:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: cms-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    pull_policy: build
    ports:
      - "5188:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cms-postgres-data:
