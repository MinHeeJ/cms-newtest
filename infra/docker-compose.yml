services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cms} -d $${POSTGRES_DB:-cms}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: professor-evaluation-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cms
      DB_USER: ${POSTGRES_USER:-cms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cms}
      PORT: 8080
      CORS_ORIGIN: http://localhost:${FRONTEND_HOST_PORT:-23000}
    ports:
      - "${BACKEND_HOST_PORT:-20080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: on-failure:5

  frontend:
    image: professor-evaluation-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "${FRONTEND_HOST_PORT:-23000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cms-postgres-data:
