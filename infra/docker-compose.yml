services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cms} -d $${POSTGRES_DB:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: cms-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cms_password}
      CMS_STORAGE_ROOT: /var/lib/cms/storage
    volumes:
      - cms-storage:/var/lib/cms/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: cms-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  cms-storage:
