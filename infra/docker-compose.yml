services:
  postgres:
    image: postgres:16.4-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noticeboard}
      POSTGRES_USER: ${POSTGRES_USER:-noticeboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noticeboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: noticeboard-backend:0.1.0
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-noticeboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-noticeboard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-noticeboard}
      JWT_SECRET: ${JWT_SECRET:-NoticeBoardJwtSecret1234567890}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin!2345}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-관리자}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: noticeboard-frontend:0.1.0
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
