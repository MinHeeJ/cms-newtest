openapi: 3.0.3
info:
  title: 교수수업평가시스템 공통 운영 관리 API
  version: 0.1.0
  description: 'CMS-1304 cms-new 공통 운영 관리 REST API contract. 모든 성공/오류 JSON 응답은 ApiResponse
    envelope를 사용한다.

    '
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health endpoint
      x-related-requirements:
      - REQ-012
      - REQ-013
      - REQ-014
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    x-related-requirements:
    - REQ-012
    - REQ-013
    - REQ-014
  /api/verifications:
    get:
      operationId: listVerifications
      summary: 담당 범위 미확인 실적 조회
      x-related-requirements:
      - REQ-001
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-043
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - UNVERIFIED
          - CERTIFIED
          - REJECTED
          - CANCELED
      - name: organizationId
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VerificationListResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-043
      x-source-original-ids:
      - CMN-FR-043
    x-related-requirements:
    - REQ-001
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-043
    x-source-original-ids:
    - CMN-FR-043
  /api/verifications/{recordId}/decision:
    post:
      operationId: decideVerification
      summary: 담당자 인증·반려·인증취소
      x-related-requirements:
      - REQ-001
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-043
      x-business-rules:
      - 담당 데이터 범위 안의 실적만 처리
      - 처리 의견과 근거 필수 연결
      - 원천 실적 수정 금지
      x-side-effects:
      - VerificationDecision 생성
      - VerificationRecord.verification_status 변경
      - audit 기록
      x-required-tests:
      - 담당 범위 내 인증 성공
      - 담당 범위 밖 403
      - 의견/근거 누락 400
      - 원천 실적 불변
      - 'happy: verify decideVerification contract'
      - 'auth: verify decideVerification contract'
      - 'validation: verify decideVerification contract'
      - 'business: verify decideVerification contract'
      - 'side-effect: verify decideVerification contract'
      x-state-transitions:
        UNVERIFIED:
        - CERTIFIED
        - REJECTED
        CERTIFIED:
        - CANCELED
        REJECTED:
        - CANCELED
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
      responses:
        '200':
          description: 처리 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-043
      x-source-original-ids:
      - CMN-FR-043
    x-related-requirements:
    - REQ-001
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-043
    x-source-original-ids:
    - CMN-FR-043
  /api/payment-approvals:
    get:
      operationId: listPaymentApprovals
      summary: 학술지원금 지급승인 대상 조회
      x-related-requirements:
      - REQ-002
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-044
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - $ref: '#/components/parameters/SortParam'
      - name: approvalStatus
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - CANCELED
      - name: applicantId
        in: query
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PaymentApprovalListResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-044
      x-source-original-ids:
      - CMN-FR-044
    x-related-requirements:
    - REQ-002
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-044
    x-source-original-ids:
    - CMN-FR-044
  /api/payment-approvals/{applicationId}/decision:
    post:
      operationId: decidePaymentApproval
      summary: 지급승인·반려·승인취소
      x-related-requirements:
      - REQ-002
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-044
      x-business-rules:
      - 승인 권한과 데이터 범위 필요
      - 실제 금융거래 실행 금지
      - 신청정보와 대상 업적 수정 금지
      x-side-effects:
      - PaymentDecision 생성
      - PaymentApproval.approval_status 변경
      - audit 기록
      x-required-tests:
      - 승인 성공
      - 권한 없음 403
      - 금융거래 side effect 없음
      - 처리자/일시 재조회
      - 'happy: verify decidePaymentApproval contract'
      - 'auth: verify decidePaymentApproval contract'
      - 'validation: verify decidePaymentApproval contract'
      - 'business: verify decidePaymentApproval contract'
      - 'side-effect: verify decidePaymentApproval contract'
      x-state-transitions:
        PENDING:
        - APPROVED
        - REJECTED
        APPROVED:
        - CANCELED
        REJECTED:
        - CANCELED
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDecisionRequest'
      responses:
        '200':
          description: 처리 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PaymentApprovalResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-044
      x-source-original-ids:
      - CMN-FR-044
    x-related-requirements:
    - REQ-002
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-044
    x-source-original-ids:
    - CMN-FR-044
  /api/rejection-reasons:
    get:
      operationId: listRejectionReasons
      summary: 업무유형별 반려사유 조회
      x-related-requirements:
      - REQ-003
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-045
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SizeParam'
      - name: businessType
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RejectionReasonListResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-045
      x-state-transitions:
        ACTIVE:
        - ACTIVE
        INACTIVE:
        - INACTIVE
      x-business-rules:
      - 업무유형별 표준 반려사유 조회는 read-only이며 상태를 변경하지 않는다.
      x-source-original-ids:
      - CMN-FR-045
    post:
      operationId: createRejectionReason
      summary: 표준 반려사유 등록
      x-related-requirements:
      - REQ-003
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-045
      x-business-rules:
      - 업무유형별 코드 unique
      - 추가 의견 허용 여부 명시
      x-side-effects:
      - RejectionReason 생성
      - audit 기록
      x-required-tests:
      - 등록 성공
      - 업무유형별 중복 코드 409
      - 추가 의견 허용 여부 저장
      - 'happy: verify createRejectionReason contract'
      - 'auth: verify createRejectionReason contract'
      - 'validation: verify createRejectionReason contract'
      - 'business: verify createRejectionReason contract'
      - 'side-effect: verify createRejectionReason contract'
      x-state-transitions:
        NONE:
        - ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionReasonRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RejectionReasonResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 중복
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-045
      x-source-original-ids:
      - CMN-FR-045
    x-related-requirements:
    - REQ-003
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-045
    x-source-original-ids:
    - CMN-FR-045
  /api/rejection-reasons/{reasonId}:
    put:
      operationId: updateRejectionReason
      summary: 표준 반려사유 수정
      x-related-requirements:
      - REQ-003
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-045
      x-business-rules:
      - 업무유형 구분 유지
      - 사용 중인 사유 hard delete 금지
      x-side-effects:
      - RejectionReason 수정
      - audit 기록
      x-required-tests:
      - 수정 성공
      - 존재하지 않는 reasonId 404
      - 업무유형별 선택 목록 반영
      - 'happy: verify updateRejectionReason contract'
      - 'auth: verify updateRejectionReason contract'
      - 'validation: verify updateRejectionReason contract'
      - 'business: verify updateRejectionReason contract'
      - 'side-effect: verify updateRejectionReason contract'
      x-state-transitions:
        ACTIVE:
        - ACTIVE
      parameters:
      - name: reasonId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionReasonRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RejectionReasonResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-045
      x-source-original-ids:
      - CMN-FR-045
    x-related-requirements:
    - REQ-003
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-045
    x-source-original-ids:
    - CMN-FR-045
  /api/appeal-opinions:
