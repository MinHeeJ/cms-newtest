              $ref: '#/components/schemas/ChangeTransitionInput'
      x-roles:
      - authenticated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 운영 IdP 또는 개발 role adapter token
  parameters:
    Page:
      name: page
      in: query
      description: 0-based page
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: field,direction
      schema:
        type: string
        default: updatedAt,desc
    Query:
      name: q
      in: query
      description: 검색/filter text
      schema:
        type: string
        maxLength: 200
    Status:
      name: status
      in: query
      description: enum status filter
      schema:
        type: string
    FolderId:
      name: folderId
      in: query
      description: Folder filter
      schema:
        type: string
        format: uuid
    OwnerId:
      name: ownerId
      in: query
      description: owner filter
      schema:
        type: string
    From:
      name: from
      in: query
      description: inclusive start
      schema:
        type: string
    To:
      name: to
      in: query
      description: inclusive end
      schema:
        type: string
  schemas:
    PageMeta:
      type: object
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ApiResponse:
      type: object
      required:
      - success
      - requestId
      - timestamp
      properties:
        success:
          type: boolean
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/PageMeta'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    FieldViolation:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
    ApiError:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        required:
        - error
        properties:
          success:
            type: boolean
            enum:
            - false
          error:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
              violations:
                type: array
                items:
                  $ref: '#/components/schemas/FieldViolation'
    FolderInput:
      type: object
      required:
      - name
      - active
      - displayOrder
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 200
        active:
          type: boolean
        displayOrder:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64
    DocumentInput:
      type: object
      required:
      - folderId
      - title
      - markdownBody
      properties:
        folderId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        markdownBody:
          type: string
        displayOrder:
          type: integer
          minimum: 0
        version:
          type: integer
          format: int64
    DocumentTransitionInput:
      type: object
      required:
      - targetStatus
      properties:
        targetStatus:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - REVIEWED
          - PUBLISHED
          - UNPUBLISHED
          - DELETED
        reason:
          type: string
        version:
          type: integer
          format: int64
    BackupRequest:
      type: object
      required:
      - targets
      properties:
        targets:
          type: string
          enum:
          - DATABASE
          - FILES
          - ALL
    RestoreVerificationRequest:
      type: object
      required:
      - backupJobId
      - target
      properties:
        backupJobId:
          type: string
          format: uuid
        target:
          type: string
          enum:
          - VALIDATION
    MigrationRequest:
      type: object
      required:
      - sourceType
      - sourceReference
      - deduplicationPolicy
      properties:
        sourceType:
          type: string
          enum:
          - CSV
          - MARKDOWN
          - FILE_TREE
        sourceReference:
          type: string
        deduplicationPolicy:
          type: string
          enum:
          - MERGE
          - SKIP
          - CREATE_NEW
    ProjectItemInput:
      type: object
      required:
      - title
      additionalProperties: true
      properties:
        title:
          type: string
          minLength: 1
        status:
          type: string
        ownerId:
          type: string
        dueDate:
          type: string
          format: date
        version:
          type: integer
          format: int64
    ChangeTransitionInput:
      type: object
      required:
      - targetStatus
      - comment
      properties:
        targetStatus:
          type: string
          enum:
          - REQUESTED
          - IMPACT_ANALYSIS
          - PENDING_APPROVAL
          - APPROVED
          - REJECTED
          - IMPLEMENTING
          - VERIFIED
        comment:
          type: string
        version:
          type: integer
          format: int64
    ScheduleItemInput:
      type: object
      required:
      - name
      - startDate
      - endDate
      - ownerId
      - status
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        ownerId:
          type: string
        status:
          type: string
          enum:
          - PLANNED
          - IN_PROGRESS
          - DELAYED
          - COMPLETED
        deliverableId:
          type: string
          format: uuid
        delayCause:
          type: string
        actionPlan:
          type: string
        version:
          type: integer
          format: int64
    RequirementItemInput:
      type: object
      required:
      - requirementKey
      - name
      - scope
      - ownerId
      - status
      properties:
        requirementKey:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - IN_SCOPE
          - OUT_OF_SCOPE
          - UNDER_REVIEW
        ownerId:
          type: string
        status:
          type: string
          enum:
          - REGISTERED
          - UNDER_REVIEW
          - IN_PROGRESS
          - COMPLETED
          - ON_HOLD
          - EXCLUDED
        version:
          type: integer
          format: int64
    WorkforceAssignmentInput:
      type: object
      required:
      - personKey
      - name
      - organization
      - role
      - startDate
      - endDate
      - allocationRate
      properties:
        personKey:
          type: string
        name:
          type: string
        organization:
          type: string
        role:
          type: string
          enum:
          - PM
          - DEVELOPER
          - QA
          - OPERATOR
          - SECURITY
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        allocationRate:
          type: number
          minimum: 0
          maximum: 1
        responsibility:
          type: string
        version:
          type: integer
          format: int64
    RiskIssueInput:
      type: object
      required:
      - title
      - type
      - cause
      - impact
      - severity
      - ownerId
      - dueDate
      - status
      properties:
        title:
          type: string
        type:
          type: string
          enum:
          - RISK
          - ISSUE
        cause:
          type: string
        impact:
          type: string
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        ownerId:
          type: string
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - REGISTERED
          - ANALYZING
          - IN_ACTION
          - RESOLVED
          - CLOSED
        version:
          type: integer
          format: int64
    DeliverableInput:
      type: object
      required:
      - name
      - type
      - dueDate
      - ownerId
      - approverId
      properties:
        name:
          type: string
        type:
          type: string
        dueDate:
          type: string
          format: date
        ownerId:
          type: string
        approverId:
          type: string
        versionLabel:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - IN_REVIEW
          - APPROVED
          - REJECTED
        version:
          type: integer
          format: int64
    ChangeRequestInput:
      type: object
      required:
      - targetType
      - targetId
      - reason
      - requesterId
      - desiredAt
      properties:
        targetType:
          type: string
        targetId:
          type: string
        reason:
          type: string
        requesterId:
          type: string
        desiredAt:
          type: string
          format: date
        status:
          type: string
          enum:
          - REQUESTED
        impacts:
          type: array
          items:
            type: object
            required:
            - area
            - impact
            - ownerId
            properties:
              area:
                type: string
                enum:
                - SCHEDULE
                - SCOPE
                - WORKFORCE
                - DELIVERABLE
                - RISK
              impact:
                type: string
              ownerId:
                type: string
        version:
          type: integer
          format: int64
  responses:
    Ok:
      description: 정상 응답
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Created:
      description: 생성 완료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Accepted:
      description: 비동기 작업 접수
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: 검증 또는 업무 규칙 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 권한 부족
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 대상 없음 또는 공개 불가
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: version 또는 상태 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: 업로드 용량 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: 허용되지 않은 파일 형식
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
