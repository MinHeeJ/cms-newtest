openapi: 3.0.3
info:
  title: Markdown CMS REST API
  version: 0.1.0
  description: 마크다운 CMS Portal/Admin/운영/사업관리 계약. canonical_id가 기본 추적 키다.
servers:
- url: /
tags:
- name: Health
- name: Portal
- name: Folders
- name: Documents
- name: Attachments
- name: Operations
- name: ProjectManagement
paths:
  /api/health:
    get:
      operationId: getPublicHealth
      tags:
      - Health
      summary: 공개 aggregate health 조회
      x-related-requirements:
      - REQ-033
      - REQ-079
      - REQ-080
      - REQ-081
      - REQ-094
      parameters: []
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '409': &id005
          $ref: '#/components/responses/Conflict'
      x-related-fr:
      - FR-022
  /api/admin/health/details:
    get:
      operationId: getDetailedHealth
      tags:
      - Health
      summary: 보호된 dependency health 조회
      x-related-requirements:
      - REQ-033
      - REQ-052
      parameters: []
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-022
      x-roles:
      - authenticated
  /api/portal/tree:
    get:
      operationId: getPortalTree
      tags:
      - Portal
      summary: Portal tree 조회
      x-related-requirements:
      - REQ-018
      - REQ-030
      - REQ-049
      - REQ-095
      - REQ-096
      - REQ-097
      - REQ-098
      - REQ-104
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/FolderId'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-007
      - FR-019
  /api/portal/documents:
    get:
      operationId: searchPortalDocuments
      tags:
      - Portal
      summary: 발행 Document 검색
      x-related-requirements:
      - REQ-012
      - REQ-029
      - REQ-030
      - REQ-047
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/FolderId'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-001
      - FR-018
      - FR-019
  /api/portal/documents/{documentId}:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getPortalDocument
      tags:
      - Portal
      summary: 발행 Document 상세 조회
      x-related-requirements:
      - REQ-031
      parameters: []
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-020
  /api/admin/folders:
    get:
      operationId: listFolders
      tags:
      - Folders
      summary: Folder collection 조회
      x-related-requirements:
      - REQ-017
      - REQ-018
      - REQ-034
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/FolderId'
      - $ref: '#/components/parameters/Status'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-006
      - FR-007
      - FR-023
      x-roles:
      - authenticated
    post:
      operationId: createFolder
      tags:
      - Folders
      summary: Folder 생성
      x-related-requirements:
      - REQ-017
      - REQ-034
      security:
      - bearerAuth: []
      x-business-rules:
      - parent가 존재하고 순환하지 않는다.
      - 같은 parent의 name과 displayOrder 규칙을 지킨다.
      x-side-effects:
      - Folder와 AuditLog를 생성한다.
      x-required-tests:
      - root/child 성공
      - 중복 name
      - 최대 depth
      - 권한 거부
      - 'happy: verify createFolder contract'
      - 'auth: verify createFolder contract'
      - 'validation: verify createFolder contract'
      - 'business: verify createFolder contract'
      - 'side-effect: verify createFolder contract'
      x-state-transitions:
      - NONE -> ACTIVE|INACTIVE
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-006
      - FR-023
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderInput'
      x-roles:
      - authenticated
  /api/admin/folders/{folderId}:
    parameters:
    - name: folderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      operationId: updateFolder
      tags:
      - Folders
      summary: Folder 수정
      x-related-requirements:
      - REQ-017
      - REQ-023
      - REQ-034
      security:
      - bearerAuth: []
      x-business-rules:
      - role, 입력값, version을 검증한다.
      x-side-effects:
      - 업무 데이터와 AuditLog를 갱신한다.
      x-required-tests:
      - 성공
      - 검증 실패
      - 권한 거부
      - 동시성 충돌
      - 'happy: verify updateFolder contract'
      - 'auth: verify updateFolder contract'
      - 'validation: verify updateFolder contract'
      - 'business: verify updateFolder contract'
      - 'side-effect: verify updateFolder contract'
      x-state-transitions:
      - ACTIVE <-> INACTIVE
      - parent 변경 시 비순환 유지
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-006
      - FR-012
      - FR-023
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderInput'
      x-roles:
      - authenticated
    delete:
      operationId: deleteFolder
      tags:
      - Folders
      summary: 빈 Folder 삭제
      x-related-requirements:
      - REQ-017
      - REQ-034
      security:
      - bearerAuth: []
      x-business-rules:
      - child Folder와 Document가 없어야 한다.
      x-side-effects:
      - Folder를 삭제하고 AuditLog를 기록한다.
      x-required-tests:
      - 빈 Folder 성공
      - child 차단
      - Document 차단
      - 경합 차단
      - 'happy: verify deleteFolder contract'
      - 'auth: verify deleteFolder contract'
      - 'validation: verify deleteFolder contract'
      - 'business: verify deleteFolder contract'
      - 'side-effect: verify deleteFolder contract'
      x-state-transitions:
      - ACTIVE|INACTIVE -> DELETED
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-006
      - FR-023
      x-roles:
      - authenticated
  /api/admin/documents:
    get:
      operationId: listAdminDocuments
      tags:
      - Documents
      summary: 관리 Document collection 조회
      x-related-requirements:
      - REQ-018
      - REQ-035
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/FolderId'
      - $ref: '#/components/parameters/Status'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-007
      - FR-024
      x-roles:
      - authenticated
    post:
      operationId: createDocument
      tags:
      - Documents
      summary: Document 생성
      x-related-requirements:
      - REQ-019
      - REQ-035
      - REQ-037
      security:
      - bearerAuth: []
      x-business-rules:
      - 유효한 Folder와 non-blank title/body가 필요하다.
      x-side-effects:
      - DRAFT Document, Revision, AuditLog를 생성한다.
      x-required-tests:
      - 생성 성공
      - 필수값 실패
      - 비활성 Folder
      - 권한 거부
      - 'happy: verify createDocument contract'
      - 'auth: verify createDocument contract'
      - 'validation: verify createDocument contract'
      - 'business: verify createDocument contract'
      - 'side-effect: verify createDocument contract'
      x-state-transitions:
      - NONE -> DRAFT
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-008
      - FR-024
      - FR-026
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      x-roles:
      - authenticated
  /api/admin/documents/{documentId}:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getAdminDocument
      tags:
      - Documents
      summary: 관리 Document 상세 조회
      x-related-requirements:
      - REQ-020
      - REQ-035
      parameters: []
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-009
      - FR-024
      x-roles:
      - authenticated
    put:
      operationId: updateDocument
      tags:
      - Documents
      summary: Document 수정
      x-related-requirements:
      - REQ-020
      - REQ-024
      - REQ-035
      - REQ-037
      security:
      - bearerAuth: []
      x-business-rules:
      - role, 입력값, version을 검증한다.
      x-side-effects:
      - Document, Revision, AuditLog를 갱신한다.
      x-required-tests:
      - 수정 성공
      - XSS sanitize
      - version 충돌
      - 삭제 상태 차단
      - 'happy: verify updateDocument contract'
      - 'auth: verify updateDocument contract'
      - 'validation: verify updateDocument contract'
      - 'business: verify updateDocument contract'
      - 'side-effect: verify updateDocument contract'
      x-state-transitions:
      - DRAFT|IN_REVIEW|REVIEWED|UNPUBLISHED -> 동일 상태 새 Revision
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-009
      - FR-013
      - FR-024
      - FR-026
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      x-roles:
      - authenticated
    delete:
      operationId: deleteDocument
      tags:
      - Documents
      summary: Document 논리삭제
      x-related-requirements:
      - REQ-022
      - REQ-035
      - REQ-037
      security:
      - bearerAuth: []
      x-business-rules:
      - ADMIN만 수행하고 Attachment 보존 정책을 적용한다.
      x-side-effects:
      - Portal/search에서 제외하고 AuditLog를 기록한다.
      x-required-tests:
      - 삭제 성공
      - 중복 삭제
      - 권한 거부
      - Attachment 정리 추적
      - 'happy: verify deleteDocument contract'
      - 'auth: verify deleteDocument contract'
      - 'validation: verify deleteDocument contract'
      - 'business: verify deleteDocument contract'
      - 'side-effect: verify deleteDocument contract'
      x-state-transitions:
      - ANY_NON_DELETED -> DELETED
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-011
      - FR-024
      - FR-026
      x-roles:
      - authenticated
  /api/admin/documents/{documentId}/transitions:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: transitionDocumentState
      tags:
      - Documents
      summary: Document 상태 전이
      x-related-requirements:
      - REQ-021
      - REQ-035
      - REQ-037
      security:
      - bearerAuth: []
      x-business-rules:
      - 허용된 targetStatus만 가능하다.
      - PUBLISHED에는 필수 publication 정보가 필요하다.
      x-side-effects:
      - publication visibility, Revision, AuditLog를 갱신한다.
      x-required-tests:
      - 각 허용 전이
      - 금지 전이
      - 비활성 Folder
      - 동일 상태
      - 'happy: verify transitionDocumentState contract'
      - 'auth: verify transitionDocumentState contract'
      - 'validation: verify transitionDocumentState contract'
      - 'business: verify transitionDocumentState contract'
      - 'side-effect: verify transitionDocumentState contract'
      x-state-transitions:
      - DRAFT -> IN_REVIEW
      - IN_REVIEW -> REVIEWED
      - REVIEWED -> PUBLISHED
      - PUBLISHED -> UNPUBLISHED
      - UNPUBLISHED -> IN_REVIEW|PUBLISHED
      - ANY_NON_DELETED -> DELETED
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-010
      - FR-024
      - FR-026
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTransitionInput'
      x-roles:
      - authenticated
  /api/admin/documents/{documentId}/attachments:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listAttachments
      tags:
      - Attachments
      summary: Attachment collection 조회
      x-related-requirements:
      - REQ-026
      - REQ-036
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/Status'
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-016
      - FR-025
      x-roles:
      - authenticated
    post:
      operationId: uploadAttachment
      tags:
      - Attachments
      summary: Attachment 업로드
      x-related-requirements:
      - REQ-015
      - REQ-025
      - REQ-026
      - REQ-036
      - REQ-053
      security:
      - bearerAuth: []
      x-business-rules:
      - allowlist, size, MIME, signature, filename, 권한을 검증한다.
      x-side-effects:
      - object와 metadata를 생성하고 실패 시 보상한다.
      x-required-tests:
      - 정상
      - 용량 초과
      - MIME 불일치
      - 암호화 PDF
      - 부분 실패
      - 'happy: verify uploadAttachment contract'
      - 'auth: verify uploadAttachment contract'
      - 'validation: verify uploadAttachment contract'
      - 'business: verify uploadAttachment contract'
      - 'side-effect: verify uploadAttachment contract'
      x-state-transitions:
      - NONE -> UPLOADING -> AVAILABLE|FAILED
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      x-related-fr:
      - FR-004
      - FR-014
      - FR-015
      - FR-025
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      x-roles:
      - authenticated
  /api/attachments/{attachmentId}:
    parameters:
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: downloadAttachment
      tags:
      - Attachments
      summary: Attachment 다운로드
      x-related-requirements:
      - REQ-015
      - REQ-026
      - REQ-036
      - REQ-069
      x-related-fr:
      - FR-004
      - FR-016
      - FR-025
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 권한 검증된 file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-roles:
      - authenticated
    delete:
      operationId: deleteAttachment
      tags:
      - Attachments
      summary: Attachment 논리삭제
      x-related-requirements:
      - REQ-028
      - REQ-036
      - REQ-037
      security:
      - bearerAuth: []
      x-business-rules:
      - 권한과 보존 정책을 검증한다.
      x-side-effects:
      - 조회/다운로드에서 제외하고 AuditLog를 기록한다.
      x-required-tests:
      - 성공
      - 중복
      - 권한 변경
      - object 불일치
      - 'happy: verify deleteAttachment contract'
      - 'auth: verify deleteAttachment contract'
      - 'validation: verify deleteAttachment contract'
      - 'business: verify deleteAttachment contract'
      - 'side-effect: verify deleteAttachment contract'
      x-state-transitions:
      - AVAILABLE|FAILED -> DELETED
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
      - FR-017
      - FR-025
      - FR-026
      x-roles:
      - authenticated
  /api/admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags:
      - Operations
      summary: AuditLog collection 조회
      x-related-requirements:
      - REQ-037
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Query'
      - $ref: '#/components/parameters/OwnerId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      x-related-fr:
