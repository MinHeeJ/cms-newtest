          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppealOpinionListResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-046
      x-source-original-ids:
      - CMN-FR-046
    x-related-requirements:
    - REQ-004
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-046
    x-source-original-ids:
    - CMN-FR-046
  /api/appeal-opinions/{appealId}/review:
    post:
      operationId: reviewAppealOpinion
      summary: 이의신청 검토 의견·처리결과 등록
