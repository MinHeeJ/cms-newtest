            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ErrorResponse'
      x-source-ids:
      - FR-046
      x-source-original-ids:
      - CMN-FR-046
    x-related-requirements:
    - REQ-004
    - REQ-013
    - REQ-014
    x-source-ids:
    - FR-046
    x-source-original-ids:
    - CMN-FR-046
  /api/evaluation-batches/generate:
    post:
      operationId: generateEvaluationBatch
      summary: 평가자료 일괄 생성
      x-related-requirements:
      - REQ-005
      - REQ-013
      - REQ-014
      x-related-fr:
      - FR-047
      x-business-rules:
      - 선택 조건과 생성기준 대상 원천 실적만 사용
      - 원천 실적 수정 금지
      - 점수 재계산/최종확정 수행 금지
      x-side-effects:
      - EvaluationBatch 생성
      - EvaluationMaterial 생성
      - BatchResult 생성
      x-required-tests:
      - 조건 확인
      - 대상 원천 실적만 생성
      - 생성기준/결과건수 조회
      - 원천 실적 불변
      - 'happy: verify generateEvaluationBatch contract'
      - 'auth: verify generateEvaluationBatch contract'
      - 'validation: verify generateEvaluationBatch contract'
      - 'business: verify generateEvaluationBatch contract'
      - 'side-effect: verify generateEvaluationBatch contract'
      x-state-transitions:
        NONE:
        - BATCH_CREATED
        - RUNNING
        - SUCCEEDED
        - FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationGenerateRequest'
      responses:
        '202':
          description: 생성 접수
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
