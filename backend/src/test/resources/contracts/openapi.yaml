components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SortParam:
      name: sort
      in: query
      schema:
        type: string
        example: updatedAt
        desc: null
  schemas:
    ApiResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
        traceId:
          type: string
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            nullable: true
    Page:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    HealthResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              status:
                type: string
                enum:
                - UP
                - DOWN
              service:
                type: string
    VerificationDecisionRequest:
      type: object
      required:
      - decisionType
      - opinion
      - evidence
      properties:
        decisionType:
          type: string
          enum:
          - CERTIFY
          - REJECT
          - CANCEL_CERTIFICATION
        opinion:
          type: string
        evidence:
          type: string
    VerificationResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
    VerificationListResponse:
