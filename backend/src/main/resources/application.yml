spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/noticeboard}
    username: ${SPRING_DATASOURCE_USERNAME:noticeboard}
    password: ${SPRING_DATASOURCE_PASSWORD:noticeboard}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never
app:
  jwt-secret: ${JWT_SECRET:ChangeMe1234567890ChangeMe1234567890}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin-email: ${ADMIN_EMAIL:admin@example.com}
  admin-password: ${ADMIN_PASSWORD:Admin1234}
  admin-nickname: ${ADMIN_NICKNAME:관리자}
server:
  port: 8080
