server:
  port: 8080
spring:
  application:
    name: cms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cms}
    username: ${SPRING_DATASOURCE_USERNAME:cms}
    password: ${SPRING_DATASOURCE_PASSWORD:cms_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${CMS_MAX_FILE_SIZE:50MB}
      max-request-size: ${CMS_MAX_REQUEST_SIZE:60MB}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
management:
  endpoints:
    web:
      exposure:
        include: health
