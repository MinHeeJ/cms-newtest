services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    volumes:
      - cms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cms
      DB_USER: cms
      DB_PASSWORD: cms
      PORT: 8080
      CORS_ORIGIN: http://localhost:5188
      STORAGE_BASE_URL: /uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5188:80"
    depends_on:
      - backend

networks:
  default:
    name: cms-267-scope-analysis-network
    ipam:
      config:
        - subnet: 10.89.67.0/24

volumes:
  cms-postgres-data:
